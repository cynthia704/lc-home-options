<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone View | Liberation Coach Homepage Options</title>
<style>
body{margin:0;background:#e9ecef;font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b1f24}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:16px}
.bar a{padding:8px 14px;border:1px solid #1b1f24;text-decoration:none;color:#1b1f24;font-weight:600;font-size:14px;background:#fff}
.bar a.on{background:#1b1f24;color:#fff}
.phone{width:414px;max-width:calc(100% - 24px);margin:0 auto 32px;background:#111;border-radius:40px;padding:14px 12px;box-shadow:0 20px 50px #0003}
iframe{display:block;width:390px;max-width:100%;height:844px;border:0;border-radius:28px;background:#fff;margin:0 auto}
</style></head><body>
<div class="bar"><a href="./">All Options</a><a id="b1" href="?o=1">Option 1</a><a id="b2" href="?o=2">Option 2</a><a id="b3" href="?o=3">Option 3</a></div>
<div class="phone"><iframe id="f" title="Phone preview"></iframe></div>
<script>
var o=new URLSearchParams(location.search).get('o');if(!/^[123]$/.test(o))o='1';
document.getElementById('f').src='option-'+o+'/';document.getElementById('b'+o).className='on';
</script></body></html>
